<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="176" viewBox="0 0 1200 176" role="img" aria-labelledby="title desc">
  <title id="title">Data, models, and evaluation</title>
  <desc id="desc">A restrained animated data flow with three connected nodes.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#132235"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#48b8cf"/>
      <stop offset="0.55" stop-color="#74dfd0"/>
      <stop offset="1" stop-color="#a5d58a"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#30415a" stroke-opacity=".25" stroke-width="1"/>
    </pattern>
    <style>
      .flow { stroke-dasharray: 8 16; animation: move 5s linear infinite; }
      .glow { transform-origin: center; transform-box: fill-box; animation: pulse 3.6s ease-in-out infinite; }
      .glow.second { animation-delay: 1.2s; }
      .glow.third { animation-delay: 2.4s; }
      @keyframes move { to { stroke-dashoffset: -72; } }
      @keyframes pulse { 0%, 100% { opacity: .16; transform: scale(.85); } 50% { opacity: .52; transform: scale(1.24); } }
      @media (prefers-reduced-motion: reduce) { .flow, .glow { animation: none; } }
    </style>
  </defs>
  <rect x=".5" y=".5" width="1199" height="175" rx="14" fill="url(#background)" stroke="#34465c"/>
  <rect x="1" y="1" width="1198" height="174" rx="14" fill="url(#grid)"/>
  <path d="M0 134 C180 134 270 83 424 83 S660 117 796 82 S1030 42 1200 42" fill="none" stroke="#304761" stroke-width="2"/>
  <path class="flow" d="M0 134 C180 134 270 83 424 83 S660 117 796 82 S1030 42 1200 42" fill="none" stroke="url(#signal)" stroke-width="2.5"/>
  <g fill="none" stroke="#80dccc" stroke-width="1.4">
    <circle class="glow" cx="268" cy="111" r="18"/>
    <circle class="glow second" cx="699" cy="100" r="18"/>
    <circle class="glow third" cx="1030" cy="49" r="18"/>
  </g>
  <g fill="#0d1117" stroke="url(#signal)" stroke-width="2.5">
    <circle cx="268" cy="111" r="6"/>
    <circle cx="699" cy="100" r="6"/>
    <circle cx="1030" cy="49" r="6"/>
  </g>
  <g fill="#b8c8d8" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="2.3">
    <text x="40" y="40">DATA ENGINEERING</text>
    <text x="445" y="40">APPLIED ML</text>
    <text x="844" y="143">MODEL EVALUATION</text>
  </g>
  <g fill="#5d7892" font-family="Consolas, monospace" font-size="11">
    <text x="40" y="151">01 / INGEST</text>
    <text x="445" y="151">02 / MODEL</text>
    <text x="844" y="40">03 / MEASURE</text>
  </g>
</svg>
